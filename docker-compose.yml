services:
  dentalgo-bi:
    build: .
    ports:
      - "3035:3000"
    environment:
      - AUTH_TRUST_HOST=true
      - REDIS_URL=redis://crm_redis:6379
    env_file:
      - .env.local
    volumes:
      - ./prisma_data:/app/prisma_data
    networks:
      - db-clone_default
    restart: always
    container_name: dentalgo-bi

  redis-queue:
    image: redis:7-alpine
    container_name: crm_redis
    restart: always
    networks:
      - db-clone_default

networks:
  db-clone_default:
    external: true

