# Template de Configuração do Nginx para o DentalGO BI
# Salve este arquivo em /etc/nginx/sites-available/dentalgo-bi e crie um link simbólico para sites-enabled

server {
    listen 80;
    server_name seu-dominio.com; # <--- ALTERE PARA O SEU DOMÍNIO

    location / {
        proxy_pass http://localhost:3035; # <--- Porta definida no docker-compose.yml
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Otimizações para buffers grandes (Next.js pode enviar headers grandes)
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # Recomendado: Configurar SSL via Certbot (Let's Encrypt) após apontar o domínio
}
